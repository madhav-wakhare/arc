[project]
name = "smriti"
version = "0.1.0"
description = "Personal work and learning tracker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",  # plain server; the [standard] extras (uvloop, websockets, file watcher) are not needed here
    "tzdata==2024.2",
    "pillow==11.1.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "SIM", "I"]
ignore = ["B008", "SIM108"]  # FastAPI Depends() defaults; ternaries are not always clearer
